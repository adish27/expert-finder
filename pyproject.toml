[project]
name = "expert-finder"
version = "0.1.0"
description = "Home services expert finder: Graph RAG with Chroma, Neo4j and LangChain"
readme = "README.md"
authors = [
    { name = "Adish" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "langchain>=1.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "neo4j>=6.4.1",
    "pinecone>=7.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
expert-finder = "expert_finder.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live Pinecone/Neo4j credentials",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Correctness and clarity checks; line length is not enforced (the data generator has long
# string literals that read better unwrapped).
select = ["F", "ARG", "I", "E7", "E9", "W"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match the interfaces they implement, and some fixtures are used
# only for their side effects (monkeypatching).
"tests/*" = ["ARG"]
