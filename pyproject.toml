[project]
name = "expert-finder"
version = "0.1.0"
description = "Home services expert finder: Graph RAG with Chroma, Neo4j and LangChain"
readme = "README.md"
authors = [
    { name = "Adish" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "langchain>=1.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "neo4j>=6.4.1",
    "pandas>=3.1.0",
    "pinecone>=7.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
expert-finder = "expert_finder.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
